<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BatXon: Gotham Realms - 60 Levels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #f0c040;
            max-width: 700px;
            width: 100%;
        }
        .bat-logo {
            color: #f0c040;
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #f0c040;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 10px;
            box-shadow: inset 0 0 30px #000;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1/1;
            touch-action: none;
        }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0 10px 0;
            color: #f0c040;
            font-size: 16px;
            text-shadow: 0 0 10px #f0c040;
        }
        .info-panel div {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 5px;
            border-radius: 30px;
            border: 1px solid #f0c040;
            text-align: center;
            font-size: 14px;
        }
        .info-panel .highlight {
            background: rgba(240, 192, 64, 0.2);
            border-color: #ffdd44;
            color: #ffdd44;
            font-size: 18px;
            font-weight: bold;
        }
        #status-msg {
            color: #ff4444;
            font-size: 20px;
            min-height: 36px;
            text-align: center;
            margin: 8px 0;
            text-shadow: 0 0 20px #ff0000;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        button {
            background: #f0c040;
            color: #0a0a0a;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(240, 192, 64, 0.3);
            font-family: 'Arial Black', sans-serif;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(240, 192, 64, 0.6);
        }
        .mobile-arrows {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
            margin-top: 12px;
        }
        .mobile-arrows button {
            padding: 0;
            font-size: 28px;
            background: rgba(240, 192, 64, 0.2);
            border: 2px solid #f0c040;
            color: #f0c040;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(240, 192, 64, 0.1);
            width: 100%;
            height: 100%;
            min-height: 50px;
        }
        .mobile-arrows button:active {
            background: rgba(240, 192, 64, 0.5);
            transform: scale(0.95);
        }
        .mobile-arrows .empty { visibility: hidden; }
        
        @media (max-width: 600px) {
            .info-panel { font-size: 12px; grid-template-columns: repeat(2, 1fr); }
            .info-panel .highlight { font-size: 14px; }
            .bat-logo { font-size: 20px; }
            #status-msg { font-size: 16px; }
            .controls button { padding: 8px 16px; font-size: 14px; }
            .mobile-arrows { display: grid; }
        }
        @media (pointer: coarse) {
            .mobile-arrows { display: grid; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="bat-logo">🦇 BATXON: GOTHAM REALMS 🦇</div>
    
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="info-panel">
        <div>🏆 Level <span id="levelDisplay">1</span>/60</div>
        <div class="highlight">📊 <span id="percentDisplay">0</span>/80%</div>
        <div>🤡 <span id="goonCount">3</span> Goons</div>
        <div>⚡ <span id="speedDisplay">500</span>ms</div>
    </div>
    
    <div id="status-msg">⬆️⬇️⬅️➡️ Draw walls to trap the Joker Goons!</div>
    
    <div class="controls">
        <button id="restartBtn">🔄 New Game</button>
        <button id="levelBtn">📋 Jump Level</button>
    </div>
    
    <div class="mobile-arrows" id="mobileControls">
        <div class="empty"></div>
        <button data-dx="0" data-dy="-1">⬆️</button>
        <div class="empty"></div>
        <button data-dx="-1" data-dy="0">⬅️</button>
        <button data-dx="0" data-dy="0">⏺️</button>
        <button data-dx="1" data-dy="0">➡️</button>
        <div class="empty"></div>
        <button data-dx="0" data-dy="1">⬇️</button>
        <div class="empty"></div>
    </div>
</div>

<script>
    // ============================================================
    //  BATXON: GOTHAM REALMS - Full JavaScript Version
    //  Snake-style movement with 60 levels
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const GRID_SIZE = 20;
    const CELL_SIZE = 600 / GRID_SIZE;
    const MAX_LEVELS = 60;
    
    // Cell states
    const EMPTY = 0;
    const WALL = 1;
    const CAPTURED = 2;
    const GOON = 3;
    
    // Game state
    let grid = [];
    let playerX = 10, playerY = 10;
    let prevX = 10, prevY = 10;
    let goons = [];
    let level = 1;
    let goonCount = 3;
    let goonSpeed = 500;
    let gameOver = false;
    let levelComplete = false;
    let gameLoopInterval = null;
    let moveCooldown = false;
    let moveTimer = null;
    
    // DOM elements
    const levelDisplay = document.getElementById('levelDisplay');
    const percentDisplay = document.getElementById('percentDisplay');
    const goonCountDisplay = document.getElementById('goonCount');
    const speedDisplay = document.getElementById('speedDisplay');
    const statusMsg = document.getElementById('status-msg');
    
    // ============================================================
    //  LEVEL CONFIGURATION
    // ============================================================
    function getLevelConfig(lvl) {
        // Goons: start at 3, add 1 every 4 levels, cap at 15
        const goons = Math.min(3 + Math.floor((lvl - 1) / 4), 15);
        // Speed: 500ms down to 150ms
        const speed = Math.max(150, 500 - (lvl - 1) * 5);
        return { goons, speed };
    }
    
    // ============================================================
    //  GRID FUNCTIONS
    // ============================================================
    function createGrid() {
        return Array.from({ length: GRID_SIZE }, () => 
            Array(GRID_SIZE).fill(EMPTY)
        );
    }
    
    function spawnGoons(count) {
        goons = [];
        for (let i = 0; i < count; i++) {
            let attempts = 0;
            while (attempts < 200) {
                const gx = Math.floor(Math.random() * GRID_SIZE);
                const gy = Math.floor(Math.random() * GRID_SIZE);
                if (grid[gy][gx] === EMPTY && !(gx === playerX && gy === playerY)) {
                    grid[gy][gx] = GOON;
                    goons.push({ x: gx, y: gy });
                    break;
                }
                attempts++;
            }
        }
    }
    
    // ============================================================
    //  FLOOD FILL (BFS)
    // ============================================================
    function floodFill(startX, startY) {
        if (grid[startY][startX] === WALL) return;
        
        const queue = [{ x: startX, y: startY }];
        const visited = new Set();
        visited.add(`${startX},${startY}`);
        
        while (queue.length > 0) {
            const { x, y } = queue.shift();
            if (grid[y][x] === EMPTY || grid[y][x] === CAPTURED) {
                grid[y][x] = CAPTURED;
                
                const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
                for (const [dx, dy] of dirs) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                        const key = `${nx},${ny}`;
                        if (!visited.has(key) && grid[ny][nx] !== WALL && grid[ny][nx] !== GOON) {
                            visited.add(key);
                            queue.push({ x: nx, y: ny });
                        }
                    }
                }
            }
        }
    }
    
    // ============================================================
    //  WALL DRAWING (Bresenham-style)
    // ============================================================
    function drawWallBetween(x1, y1, x2, y2) {
        if (x1 === x2) {
            const yMin = Math.min(y1, y2);
            const yMax = Math.max(y1, y2);
            for (let y = yMin; y <= yMax; y++) {
                if (grid[y][x1] === EMPTY) grid[y][x1] = WALL;
            }
        } else if (y1 === y2) {
            const xMin = Math.min(x1, x2);
            const xMax = Math.max(x1, x2);
            for (let x = xMin; x <= xMax; x++) {
                if (grid[y1][x] === EMPTY) grid[y1][x] = WALL;
            }
        }
    }
    
    // ============================================================
    //  PLAYER MOVEMENT (Snake-style)
    // ============================================================
    function movePlayer(dx, dy) {
        if (gameOver || levelComplete || moveCooldown) return;
        
        // Prevent moving backward (like Snake)
        if (dx === 0 && dy === 0) return;
        
        const newX = playerX + dx;
        const newY = playerY + dy;
        
        // Boundary check
        if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) return;
        
        // Can't move into wall or goon
        if (grid[newY][newX] === WALL || grid[newY][newX] === GOON) return;
        
        // Store previous position
        prevX = playerX;
        prevY = playerY;
        
        // Move player
        playerX = newX;
        playerY = newY;
        
        // Draw wall behind (if moving into empty space)
        if (grid[playerY][playerX] === EMPTY) {
            drawWallBetween(prevX, prevY, playerX, playerY);
        }
        
        // Mark current position as captured
        grid[playerY][playerX] = CAPTURED;
        
        // Flood fill from current position
        floodFill(playerX, playerY);
        
        // Check win condition
        checkWinCondition();
        
        // Update UI
        updateDisplay();
        draw();
        
        // Cooldown to prevent rapid movement (like Snake)
        moveCooldown = true;
        clearTimeout(moveTimer);
        moveTimer = setTimeout(() => {
            moveCooldown = false;
        }, 80);
    }
    
    // ============================================================
    //  WIN CONDITION CHECK
    // ============================================================
    function checkWinCondition() {
        const total = GRID_SIZE * GRID_SIZE;
        let captured = 0;
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                if (grid[y][x] === CAPTURED) captured++;
            }
        }
        const percent = Math.round((captured / total) * 100);
        
        if (percent >= 80 && !levelComplete) {
            levelComplete = true;
            gameOver = true;
            statusMsg.textContent = `✅ Level ${level} COMPLETE! 🦇`;
            statusMsg.style.color = '#44ff88';
            statusMsg.style.textShadow = '0 0 20px #44ff88';
            
            // Clear the goon loop
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            
            // Auto-advance after delay
            setTimeout(() => {
                startNextLevel();
            }, 1500);
        }
    }
    
    // ============================================================
    //  GOON AI (Random walk with wall avoidance)
    // ============================================================
    function moveGoons() {
        if (gameOver || levelComplete) return;
        
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        
        for (const goon of goons) {
            // Shuffle directions
            const shuffled = [...dirs];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            let moved = false;
            for (const [dx, dy] of shuffled) {
                const nx = goon.x + dx;
                const ny = goon.y + dy;
                
                if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                    if (grid[ny][nx] !== WALL && grid[ny][nx] !== CAPTURED && grid[ny][nx] !== GOON) {
                        // Move goon
                        grid[goon.y][goon.x] = EMPTY;
                        goon.x = nx;
                        goon.y = ny;
                        grid[ny][nx] = GOON;
                        moved = true;
                        break;
                    }
                }
            }
        }
        
        // Check collision with player
        for (const goon of goons) {
            if (goon.x === playerX && goon.y === playerY) {
                gameOver = true;
                statusMsg.textContent = '🤡 JOKER WINS! Game Over 🤡';
                statusMsg.style.color = '#ff4444';
                statusMsg.style.textShadow = '0 0 20px #ff0000';
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                draw();
                return;
            }
        }
        
        draw();
    }
    
    // ============================================================
    //  LEVEL MANAGEMENT
    // ============================================================
    function initGame() {
        // Reset state
        level = 1;
        gameOver = false;
        levelComplete = false;
        playerX = 10;
        playerY = 10;
        prevX = 10;
        prevY = 10;
        
        // Clear old interval
        if (gameLoopInterval) {
            clearInterval(gameLoopInterval);
            gameLoopInterval = null;
        }
        
        // Get level config
        const config = getLevelConfig(level);
        goonCount = config.goons;
        goonSpeed = config.speed;
        
        // Reset grid
        grid = createGrid();
        grid[playerY][playerX] = CAPTURED;
        
        // Spawn goons
        spawnGoons(goonCount);
        
        // Reset status
        statusMsg.textContent = '⬆️⬇️⬅️➡️ Draw walls to trap the Joker Goons!';
        statusMsg.style.color = '#ff4444';
        statusMsg.style.textShadow = '0 0 20px #ff0000';
        
        updateDisplay();
        draw();
        
        // Start game loop
        startGameLoop();
    }
    
    function startNextLevel() {
        if (level >= MAX_LEVELS) {
            statusMsg.textContent = '🏆 YOU BEAT ALL 60 LEVELS! BATMAN WINS! 🏆';
            statusMsg.style.color = '#ffdd44';
            statusMsg.style.textShadow = '0 0 30px #ffdd44';
            gameOver = true;
            levelComplete = false;
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
                gameLoopInterval = null;
            }
            draw();
            return;
        }
        
        level++;
        gameOver = false;
        levelComplete = false;
        playerX = 10;
        playerY = 10;
        prevX = 10;
        prevY = 10;
        
        // Get level config
        const config = getLevelConfig(level);
        goonCount = config.goons;
        goonSpeed = config.speed;
        
        // Reset grid
        grid = createGrid();
        grid[playerY][playerX] = CAPTURED;
        
        // Spawn goons
        spawnGoons(goonCount);
        
        statusMsg.textContent = `🦇 Level ${level} - ${goonCount} Joker Goons!`;
        statusMsg.style.color = '#ff4444';
        statusMsg.style.textShadow = '0 0 20px #ff0000';
        
        updateDisplay();
        draw();
        
        // Restart game loop with new speed
        if (gameLoopInterval) {
            clearInterval(gameLoopInterval);
            gameLoopInterval = null;
        }
        startGameLoop();
    }
    
    function startGameLoop() {
        if (gameLoopInterval) clearInterval(gameLoopInterval);
        gameLoopInterval = setInterval(() => {
            if (!gameOver && !levelComplete) {
                moveGoons();
            }
        }, goonSpeed);
    }
    
    function jumpToLevel() {
        const target = prompt(`Jump to which level? (1-${MAX_LEVELS})`, '1');
        if (target) {
            const num = parseInt(target);
            if (num >= 1 && num <= MAX_LEVELS) {
                level = num - 1;
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                startNextLevel();
            } else {
                alert(`Please enter a number between 1 and ${MAX_LEVELS}`);
            }
        }
    }
    
    // ============================================================
    //  UI UPDATE
    // ============================================================
    function updateDisplay() {
        levelDisplay.textContent = level;
        goonCountDisplay.textContent = goonCount;
        speedDisplay.textContent = goonSpeed;
        
        // Calculate percentage
        let captured = 0;
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                if (grid[y][x] === CAPTURED) captured++;
            }
        }
        const total = GRID_SIZE * GRID_SIZE;
        const percent = Math.round((captured / total) * 100);
        percentDisplay.textContent = `${Math.min(percent, 80)}`;
        
        // Color the percent display
        if (percent >= 80) {
            percentDisplay.style.color = '#44ff88';
        } else {
            percentDisplay.style.color = '#ffdd44';
        }
    }
    
    // ============================================================
    //  DRAWING
    // ============================================================
    function draw() {
        ctx.clearRect(0, 0, 600, 600);
        
        // Draw grid
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                const px = x * CELL_SIZE;
                const py = y * CELL_SIZE;
                const state = grid[y][x];
                
                if (state === EMPTY) {
                    ctx.fillStyle = '#1a1a2e';
                } else if (state === WALL) {
                    ctx.fillStyle = '#4a4a7a';
                } else if (state === CAPTURED) {
                    ctx.fillStyle = '#2a2a5a';
                } else if (state === GOON) {
                    ctx.fillStyle = '#6b0020';
                }
                
                ctx.fillRect(px, py, CELL_SIZE - 1, CELL_SIZE - 1);
                
                // Grid lines
                ctx.strokeStyle = '#333355';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
            }
        }
        
        // Draw Batman (player)
        const bx = playerX * CELL_SIZE + CELL_SIZE / 2;
        const by = playerY * CELL_SIZE + CELL_SIZE / 2;
        const radius = CELL_SIZE / 2 - 3;
        
        // Glow
        const gradient = ctx.createRadialGradient(bx, by, 0, bx, by, radius + 8);
        gradient.addColorStop(0, 'rgba(240, 192, 64, 0.8)');
        gradient.addColorStop(1, 'rgba(240, 192, 64, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(bx, by, radius + 8, 0, Math.PI * 2);
        ctx.fill();
        
        // Body
        ctx.beginPath();
        ctx.arc(bx, by, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#f0c040';
        ctx.shadowColor = '#f0c040';
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Bat symbol
        ctx.fillStyle = '#0a0a0a';
        ctx.font = `${CELL_SIZE - 6}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🦇', bx, by + 1);
        
        // Draw Joker Goons
        for (const goon of goons) {
            const gx = goon.x * CELL_SIZE + CELL_SIZE / 2;
            const gy = goon.y * CELL_SIZE + CELL_SIZE / 2;
            
            // Glow
            const gGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, radius + 6);
            gGrad.addColorStop(0, 'rgba(139, 0, 139, 0.6)');
            gGrad.addColorStop(1, 'rgba(139, 0, 139, 0)');
            ctx.fillStyle = gGrad;
            ctx.beginPath();
            ctx.arc(gx, gy, radius + 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Body
            ctx.beginPath();
            ctx.arc(gx, gy, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#8b008b';
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Joker face
            ctx.fillStyle = '#ffffff';
            ctx.font = `${CELL_SIZE - 6}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎭', gx, gy + 1);
        }
    }
    
    // ============================================================
    //  KEYBOARD CONTROLS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        e.preventDefault();
        
        if (key === 'ArrowUp') movePlayer(0, -1);
        else if (key === 'ArrowDown') movePlayer(0, 1);
        else if (key === 'ArrowLeft') movePlayer(-1, 0);
        else if (key === 'ArrowRight') movePlayer(1, 0);
        else if (key === 'r' || key === 'R') initGame();
    });
    
    // ============================================================
    //  MOBILE TOUCH CONTROLS
    // ============================================================
    document.querySelectorAll('.mobile-arrows button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const dx = parseInt(btn.dataset.dx || '0');
            const dy = parseInt(btn.dataset.dy || '0');
            if (dx === 0 && dy === 0) return;
            movePlayer(dx, dy);
        });
        
        // Touch events for mobile
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const dx = parseInt(btn.dataset.dx || '0');
            const dy = parseInt(btn.dataset.dy || '0');
            if (dx === 0 && dy === 0) return;
            movePlayer(dx, dy);
        });
    });
    
    // ============================================================
    //  BUTTON EVENTS
    // ============================================================
    document.getElementById('restartBtn').addEventListener('click', initGame);
    document.getElementById('levelBtn').addEventListener('click', jumpToLevel);
    
    // ============================================================
    //  START THE GAME!
    // ============================================================
    initGame();
</script>
</body>
</html>
