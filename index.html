<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatXon: Gotham Realms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            border: 2px solid #f0c040;
            max-width: 650px;
            width: 100%;
            position: relative;
        }
        .header {
            color: #f0c040;
            font-size: 22px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #f0c040;
            letter-spacing: 2px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1/1;
            border: 2px solid #333355;
            touch-action: none;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0 8px;
            color: #f0c040;
            font-size: 14px;
        }
        .info div {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #f0c040;
            text-align: center;
        }
        .info .highlight {
            background: rgba(240, 192, 64, 0.2);
            border-color: #ffdd44;
            color: #ffdd44;
            font-size: 18px;
            font-weight: bold;
        }
        .info .lives {
            border-color: #ff4444;
            color: #ff4444;
        }
        .info .restart-btn {
            border-color: #44ff88;
            color: #44ff88;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Arial Black', sans-serif;
            font-size: 14px;
            background: rgba(68, 255, 136, 0.1);
        }
        .info .restart-btn:hover {
            background: rgba(68, 255, 136, 0.3);
            transform: scale(1.05);
        }
        #status {
            color: #ffdd44;
            text-align: center;
            font-size: 16px;
            min-height: 30px;
            margin: 8px 0;
            text-shadow: 0 0 15px #ffdd44;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .controls button {
            background: #f0c040;
            color: #0a0a0a;
            border: none;
            padding: 10px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Arial Black', sans-serif;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(240, 192, 64, 0.5);
        }
        .controls button.music-btn {
            background: #8b008b;
            color: white;
        }
        .controls button.music-btn:hover {
            box-shadow: 0 0 30px rgba(139, 0, 139, 0.5);
        }
        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }
        .touch-controls button {
            background: rgba(240, 192, 64, 0.15);
            border: 2px solid #f0c040;
            color: #f0c040;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.1s;
        }
        .touch-controls button:active {
            background: rgba(240, 192, 64, 0.4);
            transform: scale(0.92);
        }
        .touch-controls .empty { visibility: hidden; }
        
        /* MAIN MENU OVERLAY */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 30, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        #mainMenu .bat-symbol {
            font-size: 120px;
            color: #f0c040;
            text-shadow: 0 0 60px #f0c040, 0 0 120px rgba(240, 192, 64, 0.3);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 60px #f0c040; }
            50% { transform: scale(1.05); text-shadow: 0 0 80px #f0c040, 0 0 120px rgba(240, 192, 64, 0.3); }
        }
        #mainMenu .title {
            color: #f0c040;
            font-size: 36px;
            text-shadow: 0 0 30px #f0c040;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        #mainMenu .subtitle {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        #mainMenu .start-btn {
            background: #f0c040;
            color: #0a0a0a;
            border: none;
            padding: 16px 60px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Arial Black', sans-serif;
            box-shadow: 0 0 40px rgba(240, 192, 64, 0.3);
            letter-spacing: 3px;
        }
        #mainMenu .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(240, 192, 64, 0.6);
        }
        #mainMenu .start-btn:active {
            transform: scale(0.95);
        }
        #mainMenu .controls-info {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }
        #mainMenu .controls-info span {
            color: #f0c040;
        }
        #mainMenu .controls-info .highlight-text {
            color: #44ff88;
        }
        
        @media (max-width: 500px) {
            #mainMenu .bat-symbol { font-size: 80px; }
            #mainMenu .title { font-size: 24px; }
            #mainMenu .start-btn { padding: 14px 40px; font-size: 18px; }
            .info { font-size: 11px; }
            .header { font-size: 16px; }
            .touch-controls { display: grid; }
        }
        @media (pointer: coarse) {
            .touch-controls { display: grid; }
        }
        
        #mainMenu.hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- MAIN MENU -->
    <div id="mainMenu">
        <div class="bat-symbol">🦇</div>
        <div class="title">BATXON</div>
        <div class="subtitle">GOTHAM REALMS</div>
        <button class="start-btn" onclick="startGame()">▶ START GAME</button>
        <div class="controls-info">
            <span>⬆⬇⬅➡</span> Move Batman<br>
            <span>Draw walls</span> to trap Joker Goons<br>
            Capture <span>80%</span> to win each level!<br>
            <span class="highlight-text">★ Corner Bonus:</span> Fill opposite corners to auto-fill the middle!
        </div>
    </div>

    <div class="header">🦇 BATXON: GOTHAM REALMS 🦇</div>
    
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="info">
        <div>🏆 Level <span id="levelDisplay">1</span>/60</div>
        <div class="highlight">📊 <span id="percentDisplay">0</span>%</div>
        <div class="lives">❤️ <span id="livesDisplay">3</span></div>
        <div class="restart-btn" id="restartBtn" onclick="resetGame()">🔄 Restart</div>
    </div>
    
    <div id="status">⬆️⬇️⬅️➡️ Draw walls & trap the Joker Goons!</div>
    
    <div class="controls">
        <button onclick="jumpLevel()">📋 Jump Level</button>
        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🔇 Music Off</button>
    </div>
    
    <div class="touch-controls" id="touchControls">
        <div class="empty"></div>
        <button data-dx="0" data-dy="-1">⬆️</button>
        <div class="empty"></div>
        <button data-dx="-1" data-dy="0">⬅️</button>
        <button data-dx="0" data-dy="0">⏺️</button>
        <button data-dx="1" data-dy="0">➡️</button>
        <div class="empty"></div>
        <button data-dx="0" data-dy="1">⬇️</button>
        <div class="empty"></div>
    </div>
</div>

<script>
    // ============================================================
    //  BATXON: GOTHAM REALMS - WITH CORNER FILL MECHANIC
    //  3-5 goons per level, restart button, working music
    // ============================================================

    // --- Music System ---
    let audioCtx = null;
    let musicPlaying = false;
    let musicTimeout = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playNote(freq, duration, type = 'square', volume = 0.12) {
        if (!audioCtx || !musicPlaying) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playBatmanTheme() {
        if (!musicPlaying) return;
        
        // Batman theme melody (simplified but recognizable)
        const notes = [
            [440, 0.12], [554, 0.12], [659, 0.12], [880, 0.18],
            [784, 0.12], [698, 0.12], [659, 0.12], [587, 0.18],
            [523, 0.12], [659, 0.12], [784, 0.12], [880, 0.18],
            [784, 0.12], [698, 0.12], [659, 0.12], [587, 0.25],
            // Repeat with variation
            [440, 0.12], [554, 0.12], [659, 0.12], [880, 0.18],
            [784, 0.12], [698, 0.12], [659, 0.12], [587, 0.18],
            [523, 0.12], [659, 0.12], [784, 0.12], [988, 0.18],
            [880, 0.12], [784, 0.12], [698, 0.12], [659, 0.3]
        ];
        
        let time = 0;
        for (const [freq, dur] of notes) {
            setTimeout(() => {
                if (musicPlaying) playNote(freq, dur, 'square', 0.10);
            }, time * 1000);
            time += dur + 0.04;
        }
        
        // Schedule next loop
        if (musicPlaying) {
            musicTimeout = setTimeout(playBatmanTheme, (time + 0.5) * 1000);
        }
    }

    function toggleMusic() {
        initAudio();
        musicPlaying = !musicPlaying;
        const btn = document.getElementById('musicBtn');
        if (musicPlaying) {
            btn.textContent = '🔊 Music On';
            btn.style.background = '#44ff88';
            btn.style.color = '#0a0a0a';
            playBatmanTheme();
        } else {
            btn.textContent = '🔇 Music Off';
            btn.style.background = '#8b008b';
            btn.style.color = 'white';
            if (musicTimeout) {
                clearTimeout(musicTimeout);
                musicTimeout = null;
            }
        }
    }

    // --- Canvas Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const CELL = 600 / GRID;
    const MAX_LEVELS = 60;

    // --- Cell States ---
    const EMPTY = 0, WALL = 1, CAPTURED = 2, GOON = 3;

    // --- Game State ---
    let grid = [];
    let player = { x: 10, y: 10 };
    let prev = { x: 10, y: 10 };
    let goons = [];
    let level = 1;
    let goonCount = 3;
    let goonSpeed = 500;
    let lives = 3;
    let gameOver = false;
    let levelDone = false;
    let moveQueue = [];
    let dir = { dx: 0, dy: 0 };
    let moveInterval = null;
    let goonInterval = null;
    let gameLoopActive = false;
    let gameStarted = false;
    let cornerBonusActive = false;

    // --- DOM Refs ---
    const levelDisplay = document.getElementById('levelDisplay');
    const percentDisplay = document.getElementById('percentDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    const mainMenu = document.getElementById('mainMenu');

    // ============================================================
    //  MAIN MENU
    // ============================================================
    function startGame() {
        mainMenu.classList.add('hidden');
        gameStarted = true;
        initGame();
        // Start music if not already playing
        if (!musicPlaying) {
            toggleMusic();
        }
    }

    // ============================================================
    //  LEVEL CONFIG - 3-5 GOONS PER LEVEL
    // ============================================================
    function getConfig(lvl) {
        // 3-5 goons per level, randomized
        const baseGoons = 3 + Math.floor(Math.random() * 3); // 3, 4, or 5
        const g = Math.min(baseGoons + Math.floor((lvl - 1) / 10), 8);
        const s = Math.max(150, 500 - (lvl - 1) * 5);
        return { goons: g, speed: s };
    }

    // ============================================================
    //  GRID
    // ============================================================
    function makeGrid() {
        return Array.from({ length: GRID }, () => Array(GRID).fill(EMPTY));
    }

    function spawnGoons(count) {
        goons = [];
        for (let i = 0; i < count; i++) {
            let attempts = 0;
            let placed = false;
            while (attempts < 500 && !placed) {
                const x = Math.floor(Math.random() * GRID);
                const y = Math.floor(Math.random() * GRID);
                if (grid[y][x] === EMPTY && !(x === player.x && y === player.y)) {
                    grid[y][x] = GOON;
                    goons.push({ x, y });
                    placed = true;
                }
                attempts++;
            }
            if (!placed) {
                for (let y = 0; y < GRID && !placed; y++) {
                    for (let x = 0; x < GRID && !placed; x++) {
                        if (grid[y][x] === EMPTY && !(x === player.x && y === player.y)) {
                            grid[y][x] = GOON;
                            goons.push({ x, y });
                            placed = true;
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    //  REACHABLE CELLS (BFS)
    // ============================================================
    function getReachable(sx, sy) {
        const visited = new Set();
        const queue = [{ x: sx, y: sy }];
        const result = [];
        while (queue.length) {
            const { x, y } = queue.shift();
            const key = x + ',' + y;
            if (visited.has(key)) continue;
            if (x < 0 || x >= GRID || y < 0 || y >= GRID) continue;
            if (grid[y][x] === WALL || grid[y][x] === GOON) continue;
            visited.add(key);
            result.push([x, y]);
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            for (const [dx, dy] of dirs) {
                const nx = x + dx, ny = y + dy;
                if (!visited.has(nx + ',' + ny)) queue.push({ x: nx, y: ny });
            }
        }
        return result;
    }

    // ============================================================
    //  CORNER FILL MECHANIC - NEW!
    // ============================================================
    function checkCornerBonus() {
        // Check if top-left corner is filled
        const tl = grid[0][0] === CAPTURED;
        // Check if bottom-right corner is filled
        const br = grid[GRID-1][GRID-1] === CAPTURED;
        // Check if top-right corner is filled
        const tr = grid[0][GRID-1] === CAPTURED;
        // Check if bottom-left corner is filled
        const bl = grid[GRID-1][0] === CAPTURED;
        
        let bonusActivated = false;
        
        // If TL and BR are filled, fill the middle!
        if (tl && br && !cornerBonusActive) {
            bonusActivated = true;
            let filled = 0;
            for (let y = 2; y < GRID-2; y++) {
                for (let x = 2; x < GRID-2; x++) {
                    if (grid[y][x] === EMPTY) {
                        grid[y][x] = CAPTURED;
                        filled++;
                    }
                }
            }
            if (filled > 0) {
                statusEl.textContent = '🌟 CORNER BONUS! Top-Left + Bottom-Right filled!';
                statusEl.style.color = '#44ff88';
                statusEl.style.textShadow = '0 0 30px #44ff88';
                cornerBonusActive = true;
                // Play happy sound
                playNote(523, 0.1);
                setTimeout(() => playNote(659, 0.1), 120);
                setTimeout(() => playNote(784, 0.15), 240);
                checkWin();
                updateUI();
                draw();
                return true;
            }
        }
        
        // If TR and BL are filled, fill the middle!
        if (tr && bl && !cornerBonusActive) {
            bonusActivated = true;
            let filled = 0;
            for (let y = 2; y < GRID-2; y++) {
                for (let x = 2; x < GRID-2; x++) {
                    if (grid[y][x] === EMPTY) {
                        grid[y][x] = CAPTURED;
                        filled++;
                    }
                }
            }
            if (filled > 0) {
                statusEl.textContent = '🌟 CORNER BONUS! Top-Right + Bottom-Left filled!';
                statusEl.style.color = '#44ff88';
                statusEl.style.textShadow = '0 0 30px #44ff88';
                cornerBonusActive = true;
                playNote(523, 0.1);
                setTimeout(() => playNote(659, 0.1), 120);
                setTimeout(() => playNote(784, 0.15), 240);
                checkWin();
                updateUI();
                draw();
                return true;
            }
        }
        
        return false;
    }

    // ============================================================
    //  PACXON-STYLE FILL
    // ============================================================
    function captureEnclosedArea() {
        const reachable = getReachable(player.x, player.y);
        const reachableSet = new Set(reachable.map(([x, y]) => x + ',' + y));
        let captured = 0;
        for (let y = 0; y < GRID; y++) {
            for (let x = 0; x < GRID; x++) {
                if (grid[y][x] === EMPTY && !reachableSet.has(x + ',' + y)) {
                    grid[y][x] = CAPTURED;
                    captured++;
                }
            }
        }
        return captured;
    }

    // ============================================================
    //  LOOP DETECTION
    // ============================================================
    function checkLoopClosure(x, y) {
        let connections = 0;
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const [dx, dy] of dirs) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                if (grid[ny][nx] === WALL) connections++;
            }
        }
        if (connections >= 2) {
            const captured = captureEnclosedArea();
            if (captured > 0) {
                // Check corner bonus after capture
                checkCornerBonus();
                return true;
            }
        }
        return false;
    }

    // ============================================================
    //  WALL DRAWING
    // ============================================================
    function drawWall(x1, y1, x2, y2) {
        let captured = false;
        if (x1 === x2) {
            const yMin = Math.min(y1, y2), yMax = Math.max(y1, y2);
            for (let y = yMin; y <= yMax; y++) {
                if (grid[y][x1] === EMPTY) {
                    grid[y][x1] = WALL;
                    if (checkLoopClosure(x1, y)) captured = true;
                }
            }
        } else if (y1 === y2) {
            const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2);
            for (let x = xMin; x <= xMax; x++) {
                if (grid[y1][x] === EMPTY) {
                    grid[y1][x] = WALL;
                    if (checkLoopClosure(x, y1)) captured = true;
                }
            }
        }
        return captured;
    }

    // ============================================================
    //  PLAYER MOVEMENT
    // ============================================================
    function movePlayer() {
        if (gameOver || levelDone || !gameLoopActive || !gameStarted) return;

        if (moveQueue.length > 0) {
            const next = moveQueue.shift();
            if (!(next.dx === -dir.dx && next.dy === -dir.dy)) {
                dir = next;
            }
        }

        if (dir.dx === 0 && dir.dy === 0) return;

        const nx = player.x + dir.dx;
        const ny = player.y + dir.dy;

        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) return;
        if (grid[ny][nx] === WALL || grid[ny][nx] === GOON) return;

        prev.x = player.x;
        prev.y = player.y;
        player.x = nx;
        player.y = ny;

        if (grid[ny][nx] === EMPTY) {
            const captured = drawWall(prev.x, prev.y, player.x, player.y);
            if (captured) {
                checkWin();
            }
        }

        grid[ny][nx] = CAPTURED;
        updateUI();
        draw();
        checkGoonCollision();
    }

    // ============================================================
    //  GOON COLLISION - KILLS PLAYER!
    // ============================================================
    function checkGoonCollision() {
        for (const goon of goons) {
            const dx = Math.abs(goon.x - player.x);
            const dy = Math.abs(goon.y - player.y);
            if (dx <= 1 && dy <= 1) {
                loseLife();
                return true;
            }
        }
        return false;
    }

    // ============================================================
    //  WIN CHECK
    // ============================================================
    function checkWin() {
        let captured = 0;
        for (let y = 0; y < GRID; y++)
            for (let x = 0; x < GRID; x++)
                if (grid[y][x] === CAPTURED) captured++;
        const pct = Math.round((captured / (GRID * GRID)) * 100);

        if (pct >= 80 && !levelDone) {
            levelDone = true;
            gameOver = true;
            statusEl.textContent = '✅ Level ' + level + ' COMPLETE! 🦇';
            statusEl.style.color = '#44ff88';
            statusEl.style.textShadow = '0 0 30px #44ff88';
            stopLoops();
            // Victory fanfare
            playNote(523, 0.12);
            setTimeout(() => playNote(659, 0.12), 150);
            setTimeout(() => playNote(784, 0.18), 300);
            setTimeout(() => {
                if (!gameOver) nextLevel();
            }, 1500);
        }
        updateUI();
    }

    // ============================================================
    //  GOON AI
    // ============================================================
    function moveGoons() {
        if (gameOver || levelDone || !gameLoopActive || !gameStarted) return;

        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const goon of goons) {
            const shuffled = [...dirs];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            let moved = false;
            for (const [dx, dy] of shuffled) {
                const nx = goon.x + dx;
                const ny = goon.y + dy;
                if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                    if (grid[ny][nx] !== WALL && grid[ny][nx] !== CAPTURED && grid[ny][nx] !== GOON) {
                        grid[goon.y][goon.x] = EMPTY;
                        goon.x = nx;
                        goon.y = ny;
                        grid[ny][nx] = GOON;
                        moved = true;
                        break;
                    }
                }
            }
        }

        checkGoonCollision();
        draw();
    }

    // ============================================================
    //  LIVES
    // ============================================================
    function loseLife() {
        lives--;
        livesDisplay.textContent = lives;
        
        // Death sound
        playNote(200, 0.3, 'sawtooth', 0.15);
        setTimeout(() => playNote(150, 0.4, 'sawtooth', 0.12), 200);
        
        if (lives <= 0) {
            gameOver = true;
            statusEl.textContent = '💀 GAME OVER - Joker Wins! 💀';
            statusEl.style.color = '#ff0000';
            statusEl.style.textShadow = '0 0 30px #ff0000';
            stopLoops();
            draw();
            return;
        }

        statusEl.textContent = '💔 Lost a life! ' + lives + ' remaining';
        statusEl.style.color = '#ff6644';
        statusEl.style.textShadow = '0 0 20px #ff6644';

        // Reset player position
        player.x = 10;
        player.y = 10;
        prev.x = 10;
        prev.y = 10;
        dir = { dx: 0, dy: 0 };
        moveQueue = [];
        cornerBonusActive = false;
        
        // Clear goons from grid
        for (const g of goons) {
            if (g.x >= 0 && g.x < GRID && g.y >= 0 && g.y < GRID) {
                grid[g.y][g.x] = EMPTY;
            }
        }
        
        // Respawn goons
        spawnGoons(goonCount);
        grid[player.y][player.x] = CAPTURED;

        updateUI();
        draw();
        
        if (!gameOver && !levelDone) {
            startLoops();
        }
    }
