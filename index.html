<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatXon: Gotham Realms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            border: 2px solid #f0c040;
            max-width: 650px;
            width: 100%;
        }
        .header {
            color: #f0c040;
            font-size: 22px;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #f0c040;
            letter-spacing: 2px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1/1;
            border: 2px solid #333355;
            touch-action: none;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0 8px;
            color: #f0c040;
            font-size: 14px;
        }
        .info div {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #f0c040;
            text-align: center;
        }
        .info .highlight {
            background: rgba(240, 192, 64, 0.2);
            border-color: #ffdd44;
            color: #ffdd44;
            font-size: 18px;
            font-weight: bold;
        }
        .info .lives {
            border-color: #ff4444;
            color: #ff4444;
        }
        #status {
            color: #ffdd44;
            text-align: center;
            font-size: 16px;
            min-height: 30px;
            margin: 8px 0;
            text-shadow: 0 0 15px #ffdd44;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .controls button {
            background: #f0c040;
            color: #0a0a0a;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Arial Black', sans-serif;
        }
        .controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(240, 192, 64, 0.5);
        }
        .controls button.danger {
            background: #ff4444;
            color: white;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        .controls button.danger:hover {
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.6);
        }
        .touch-controls {
            display: none;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }
        .touch-controls button {
            background: rgba(240, 192, 64, 0.15);
            border: 2px solid #f0c040;
            color: #f0c040;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: 0.1s;
        }
        .touch-controls button:active {
            background: rgba(240, 192, 64, 0.4);
            transform: scale(0.92);
        }
        .touch-controls .empty { visibility: hidden; }
        
        @media (pointer: coarse) {
            .touch-controls { display: grid; }
        }
        @media (max-width: 500px) {
            .info { font-size: 11px; }
            .header { font-size: 16px; }
            .touch-controls { display: grid; }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">🦇 BATXON: GOTHAM REALMS 🦇</div>
    
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="info">
        <div>🏆 Level <span id="levelDisplay">1</span>/60</div>
        <div class="highlight">📊 <span id="percentDisplay">0</span>%</div>
        <div class="lives">❤️ <span id="livesDisplay">3</span></div>
        <div>🤡 <span id="goonDisplay">3</span></div>
    </div>
    
    <div id="status">⬆️⬇️⬅️➡️ Draw walls & trap the Joker Goons!</div>
    
    <div class="controls">
        <button id="restartBtn" onclick="initGame()">🔄 New Game</button>
        <button onclick="jumpLevel()">📋 Jump Level</button>
    </div>
    
    <div class="touch-controls" id="touchControls">
        <div class="empty"></div>
        <button data-dx="0" data-dy="-1">⬆️</button>
        <div class="empty"></div>
        <button data-dx="-1" data-dy="0">⬅️</button>
        <button data-dx="0" data-dy="0">⏺️</button>
        <button data-dx="1" data-dy="0">➡️</button>
        <div class="empty"></div>
        <button data-dx="0" data-dy="1">⬇️</button>
        <div class="empty"></div>
    </div>
</div>

<script>
    // ============================================================
    //  BATXON: GOTHAM REALMS - FINAL VERSION
    //  Fixed restart, proper goon collision, full playability
    // ============================================================

    // --- Canvas Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID = 20;
    const CELL = 600 / GRID;
    const MAX_LEVELS = 60;

    // --- Cell States ---
    const EMPTY = 0, WALL = 1, CAPTURED = 2, GOON = 3;

    // --- Game State ---
    let grid = [];
    let player = { x: 10, y: 10 };
    let prev = { x: 10, y: 10 };
    let goons = [];
    let level = 1;
    let goonCount = 3;
    let goonSpeed = 500;
    let lives = 3;
    let gameOver = false;
    let levelDone = false;
    let moveQueue = [];
    let dir = { dx: 0, dy: 0 };
    let moveInterval = null;
    let goonInterval = null;
    let gameLoopActive = false;

    // --- DOM Refs ---
    const levelDisplay = document.getElementById('levelDisplay');
    const percentDisplay = document.getElementById('percentDisplay');
    const livesDisplay = document.getElementById('livesDisplay');
    const goonDisplay = document.getElementById('goonDisplay');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');

    // ============================================================
    //  LEVEL CONFIG
    // ============================================================
    function getConfig(lvl) {
        const g = Math.min(3 + Math.floor((lvl - 1) / 4), 15);
        const s = Math.max(150, 500 - (lvl - 1) * 5);
        return { goons: g, speed: s };
    }

    // ============================================================
    //  GRID
    // ============================================================
    function makeGrid() {
        return Array.from({ length: GRID }, () => Array(GRID).fill(EMPTY));
    }

    function spawnGoons(count) {
        goons = [];
        for (let i = 0; i < count; i++) {
            let attempts = 0;
            let placed = false;
            while (attempts < 500 && !placed) {
                const x = Math.floor(Math.random() * GRID);
                const y = Math.floor(Math.random() * GRID);
                if (grid[y][x] === EMPTY && !(x === player.x && y === player.y)) {
                    grid[y][x] = GOON;
                    goons.push({ x, y });
                    placed = true;
                }
                attempts++;
            }
            // Fallback: place anywhere
            if (!placed) {
                for (let y = 0; y < GRID && !placed; y++) {
                    for (let x = 0; x < GRID && !placed; x++) {
                        if (grid[y][x] === EMPTY && !(x === player.x && y === player.y)) {
                            grid[y][x] = GOON;
                            goons.push({ x, y });
                            placed = true;
                        }
                    }
                }
            }
        }
    }

    // ============================================================
    //  REACHABLE CELLS (BFS)
    // ============================================================
    function getReachable(sx, sy) {
        const visited = new Set();
        const queue = [{ x: sx, y: sy }];
        const result = [];
        while (queue.length) {
            const { x, y } = queue.shift();
            const key = x + ',' + y;
            if (visited.has(key)) continue;
            if (x < 0 || x >= GRID || y < 0 || y >= GRID) continue;
            if (grid[y][x] === WALL || grid[y][x] === GOON) continue;
            visited.add(key);
            result.push([x, y]);
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            for (const [dx, dy] of dirs) {
                const nx = x + dx, ny = y + dy;
                if (!visited.has(nx + ',' + ny)) queue.push({ x: nx, y: ny });
            }
        }
        return result;
    }

    // ============================================================
    //  LOOP DETECTION & CAPTURE
    // ============================================================
    function detectAndCapture() {
        const reachable = getReachable(player.x, player.y);
        const reachableSet = new Set(reachable.map(([x, y]) => x + ',' + y));
        let captured = 0;
        for (let y = 0; y < GRID; y++) {
            for (let x = 0; x < GRID; x++) {
                if (grid[y][x] === EMPTY && !reachableSet.has(x + ',' + y)) {
                    grid[y][x] = CAPTURED;
                    captured++;
                }
            }
        }
        return captured > 0;
    }

    function checkLoopClosure(x, y) {
        let connections = 0;
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const [dx, dy] of dirs) {
            const nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                if (grid[ny][nx] === WALL) connections++;
            }
        }
        if (connections >= 2) {
            return detectAndCapture();
        }
        return false;
    }

    // ============================================================
    //  WALL DRAWING
    // ============================================================
    function drawWall(x1, y1, x2, y2) {
        let captured = false;
        if (x1 === x2) {
            const yMin = Math.min(y1, y2), yMax = Math.max(y1, y2);
            for (let y = yMin; y <= yMax; y++) {
                if (grid[y][x1] === EMPTY) {
                    grid[y][x1] = WALL;
                    if (checkLoopClosure(x1, y)) captured = true;
                }
            }
        } else if (y1 === y2) {
            const xMin = Math.min(x1, x2), xMax = Math.max(x1, x2);
            for (let x = xMin; x <= xMax; x++) {
                if (grid[y1][x] === EMPTY) {
                    grid[y1][x] = WALL;
                    if (checkLoopClosure(x, y1)) captured = true;
                }
            }
        }
        return captured;
    }

    // ============================================================
    //  PLAYER MOVEMENT (Snake-style)
    // ============================================================
    function movePlayer() {
        if (gameOver || levelDone || !gameLoopActive) return;

        if (moveQueue.length > 0) {
            const next = moveQueue.shift();
            if (!(next.dx === -dir.dx && next.dy === -dir.dy)) {
                dir = next;
            }
        }

        if (dir.dx === 0 && dir.dy === 0) return;

        const nx = player.x + dir.dx;
        const ny = player.y + dir.dy;

        if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) return;
        if (grid[ny][nx] === WALL || grid[ny][nx] === GOON) return;

        prev.x = player.x;
        prev.y = player.y;
        player.x = nx;
        player.y = ny;

        if (grid[ny][nx] === EMPTY) {
            const captured = drawWall(prev.x, prev.y, player.x, player.y);
            if (captured) checkWin();
        }

        grid[ny][nx] = CAPTURED;
        updateUI();
        draw();
        
        // Check if player is on a goon (shouldn't happen, but safety)
        checkGoonCollision();
    }

    // ============================================================
    //  GOON COLLISION CHECK
    // ============================================================
    function checkGoonCollision() {
        // Check if any goon is on the same cell as player
        for (const goon of goons) {
            if (goon.x === player.x && goon.y === player.y) {
                loseLife();
                return true;
            }
        }
        return false;
    }

    // ============================================================
    //  WIN CHECK
    // ============================================================
    function checkWin() {
        let captured = 0;
        for (let y = 0; y < GRID; y++)
            for (let x = 0; x < GRID; x++)
                if (grid[y][x] === CAPTURED) captured++;
        const pct = Math.round((captured / (GRID * GRID)) * 100);

        if (pct >= 80 && !levelDone) {
            levelDone = true;
            gameOver = true;
            statusEl.textContent = '✅ Level ' + level + ' COMPLETE! 🦇';
            statusEl.style.color = '#44ff88';
            statusEl.style.textShadow = '0 0 30px #44ff88';
            stopLoops();
            setTimeout(() => {
                if (!gameOver) nextLevel();
            }, 1500);
        }
        updateUI();
    }

    // ============================================================
    //  GOON AI
    // ============================================================
    function moveGoons() {
        if (gameOver || levelDone || !gameLoopActive) return;

        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        for (const goon of goons) {
            const shuffled = [...dirs];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            let moved = false;
            for (const [dx, dy] of shuffled) {
                const nx = goon.x + dx;
                const ny = goon.y + dy;
                if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                    if (grid[ny][nx] !== WALL && grid[ny][nx] !== CAPTURED && grid[ny][nx] !== GOON) {
                        grid[goon.y][goon.x] = EMPTY;
                        goon.x = nx;
                        goon.y = ny;
                        grid[ny][nx] = GOON;
                        moved = true;
                        break;
                    }
                }
            }
        }

        // Check collision with player
        checkGoonCollision();
        draw();
    }

    // ============================================================
    //  LIVES
    // ============================================================
    function loseLife() {
        lives--;
        livesDisplay.textContent = lives;
        
        if (lives <= 0) {
            gameOver = true;
            statusEl.textContent = '💀 GAME OVER - Joker Wins! 💀';
            statusEl.style.color = '#ff0000';
            statusEl.style.textShadow = '0 0 30px #ff0000';
            stopLoops();
            draw();
            restartBtn.textContent = '🔄 Play Again';
            return;
        }

        statusEl.textContent = '💔 Lost a life! ' + lives + ' remaining';
        statusEl.style.color = '#ff6644';
        statusEl.style.textShadow = '0 0 20px #ff6644';

        // Reset player position
        player.x = 10;
        player.y = 10;
        prev.x = 10;
        prev.y = 10;
        dir = { dx: 0, dy: 0 };
        moveQueue = [];
        
        // Clear goons from grid
        for (const g of goons) {
            if (g.x >= 0 && g.x < GRID && g.y >= 0 && g.y < GRID) {
                grid[g.y][g.x] = EMPTY;
            }
        }
        
        // Respawn goons
        spawnGoons(goonCount);
        grid[player.y][player.x] = CAPTURED;

        updateUI();
        draw();
        
        // Restart loops if game is still active
        if (!gameOver && !levelDone) {
            startLoops();
        }
    }

    // ============================================================
    //  LEVEL MANAGEMENT
    // ============================================================
    function initGame() {
        // Reset everything
        level = 1;
        lives = 3;
        gameOver = false;
        levelDone = false;
        player.x = 10;
        player.y = 10;
        prev.x = 10;
        prev.y = 10;
        dir = { dx: 0, dy: 0 };
        moveQueue = [];
        gameLoopActive = true;
        restartBtn.textContent = '🔄 New Game';

        stopLoops();
        const config = getConfig(level);
        goonCount = config.goons;
        goonSpeed = config.speed;

        grid = makeGrid();
        grid[player.y][player.x] = CAPTURED;
        spawnGoons(goonCount);

        statusEl.textContent = '⬆️⬇️⬅️➡️ Draw walls & trap the Joker Goons!';
        statusEl.style.color = '#ffdd44';
        statusEl.style.textShadow = '0 0 15px #ffdd44';
        updateUI();
        draw();
        startLoops();
    }

    function nextLevel() {
        if (level >= MAX_LEVELS) {
            statusEl.textContent = '🏆 YOU BEAT ALL 60 LEVELS! BATMAN WINS! 🏆';
            statusEl.style.color = '#ffdd44';
            statusEl.style.textShadow = '0 0 30px #ffdd44';
            gameOver = true;
            levelDone = false;
            gameLoopActive = false;
            stopLoops();
            draw();
            restartBtn.textContent = '🔄 Play Again';
            return;
        }

        level++;
        gameOver = false;
        levelDone = false;
        lives = 3;
        player.x = 10;
        player.y = 10;
        prev.x = 10;
        prev.y = 10;
        dir = { dx: 0, dy: 0 };
        moveQueue = [];
        gameLoopActive = true;
        restartBtn.textContent = '🔄 New Game';

        const config = getConfig(level);
        goonCount = config.goons;
        goonSpeed = config.speed;

        grid = makeGrid();
        grid[player.y][player.x] = CAPTURED;
        spawnGoons(goonCount);

        statusEl.textContent = '🦇 Level ' + level + ' - ' + goonCount + ' Joker Goons!';
        statusEl.style.color = '#ffdd44';
        statusEl.style.textShadow = '0 0 20px #ffdd44';
        updateUI();
        draw();
        startLoops();
    }

    function jumpLevel() {
        if (gameOver) {
            // Allow jump even when game over
            gameOver = false;
            levelDone = false;
            gameLoopActive = true;
        }
        const target = prompt('Jump to which level? (1-' + MAX_LEVELS + ')', '1');
        if (target) {
            const num = parseInt(target);
            if (num >= 1 && num <= MAX_LEVELS) {
                level = num - 1;
                lives = 3;
                stopLoops();
                restartBtn.textContent = '🔄 New Game';
                gameLoopActive = true;
                gameOver = false;
                levelDone = false;
                nextLevel();
            } else {
                alert('Enter a number between 1 and ' + MAX_LEVELS);
            }
        }
    }

    // ============================================================
    //  LOOPS
    // ============================================================
    function startLoops() {
        stopLoops();
        gameLoopActive = true;
        moveInterval = setInterval(movePlayer, 100);
        goonInterval = setInterval(moveGoons, goonSpeed);
    }

    function stopLoops() {
        gameLoopActive = false;
        if (moveInterval) clearInterval(moveInterval);
        if (goonInterval) clearInterval(goonInterval);
        moveInterval = null;
        goonInterval = null;
    }

    // ============================================================
    //  UI
    // ============================================================
    function updateUI() {
        levelDisplay.textContent = level;
        livesDisplay.textContent = lives;
        goonDisplay.textContent = goonCount;

        let captured = 0;
        for (let y = 0; y < GRID; y++)
            for (let x = 0; x < GRID; x++)
                if (grid[y][x] === CAPTURED) captured++;
        const pct = Math.round((captured / (GRID * GRID)) * 100);
        percentDisplay.textContent = Math.min(pct, 80);
        percentDisplay.style.color = pct >= 80 ? '#44ff88' : '#ffdd44';
    }

    // ============================================================
    //  DRAW
    // ============================================================
    function draw() {
        ctx.clearRect(0, 0, 600, 600);

        // Grid
        for (let y = 0; y < GRID; y++) {
            for (let x = 0; x < GRID; x++) {
                const px = x * CELL, py = y * CELL;
                const state = grid[y][x];
                ctx.fillStyle = state === EMPTY ? '#1a1a2e' :
                                state === WALL ? '#4a4a7a' :
                                state === CAPTURED ? '#2a2a5a' :
                                '#6b0020';
                ctx.fillRect(px, py, CELL - 1, CELL - 1);
                ctx.strokeStyle = '#333355';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(px, py, CELL, CELL);
            }
        }

        // Batman
        const bx = player.x * CELL + CELL / 2;
        const by = player.y * CELL + CELL / 2;
        const r = CELL / 2 - 3;

        const grad = ctx.createRadialGradient(bx, by, 0, bx, by, r + 10);
        grad.addColorStop(0, 'rgba(240, 192, 64, 0.6)');
        grad.addColorStop(1, 'rgba(240, 192, 64, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bx, by, r + 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fillStyle = '#f0c040';
        ctx.shadowColor = '#f0c040';
        ctx.shadowBlur = 25;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#0a0a0a';
        ctx.font = (CELL - 4) + 'px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🦇', bx, by + 1);

        // Goons
        for (const goon of goons) {
            const gx = goon.x * CELL + CELL / 2;
            const gy = goon.y * CELL + CELL / 2;

            const ggrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, r + 8);
            ggrad.addColorStop(0, 'rgba(139, 0, 139, 0.5)');
            ggrad.addColorStop(1, 'rgba(139, 0, 139, 0)');
            ctx.fillStyle = ggrad;
            ctx.beginPath();
            ctx.arc(gx, gy, r + 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(gx, gy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#8b008b';
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.font = (CELL - 4) + 'px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🎭', gx, gy + 1);
        }
    }

    // ============================================================
    //  CONTROLS
    // ============================================================
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
            e.preventDefault();
        }
        let nd = null;
        if (key === 'ArrowUp') nd = { dx: 0, dy: -1 };
        else if (key === 'ArrowDown') nd = { dx: 0, dy: 1 };
        else if (key === 'ArrowLeft') nd = { dx: -1, dy: 0 };
        else if (key === 'ArrowRight') nd = { dx: 1, dy: 0 };
        else if (key === 'r' || key === 'R') { initGame(); return; }
        if (nd && moveQueue.length < 3) moveQueue.push(nd);
    });

    // Touch controls
    document.querySelectorAll('#touchControls button').forEach(btn => {
        const handler = () => {
            const dx = parseInt(btn.dataset.dx || '0');
            const dy = parseInt(btn.dataset.dy || '0');
            if (dx === 0 && dy === 0) return;
            if (moveQueue.length < 3) moveQueue.push({ dx, dy });
        };
        btn.addEventListener('click', handler);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handler(); });
    });

    // ============================================================
    //  START THE GAME!
    // ============================================================
    initGame();
</script>
</body>
</html>
